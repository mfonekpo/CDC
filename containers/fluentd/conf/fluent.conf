<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

<match docker.**>
  @type loki
  url "http://loki:3100"

  extra_labels {"job":"docker"}
  label_keys "container,source"
  remove_keys "container,source"

  line_format key_value

  <buffer>
    flush_interval 5s
    chunk_limit_size 1m
    flush_at_shutdown true
  </buffer>
</match>
