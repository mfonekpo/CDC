<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

<filter docker.**>
  @type parser
  key_name log

  <parse>
    @type json
  </parse>
</filter>

<match docker.**>

  @type copy

  <store>
    @type loki
    url "http://lomi:3100"
    extra_labels {"job":"docker"}
    label_keys "container_name, source"
    remove_keys "container, source"
    line_format key_value

    <buffer>
      flush_interval 5s
      chunk_limit_size 1m
      flush_at_shutdown true
    </buffer>
  </store>


  <store>
    @type loki
    url "https://logs-prod-012.grafana.net"
    username "#{ENV['LOKI_USERNAME']}"
    password "#{ENV['LOKI_TOKEN']}"

    extra_labels {"job":"docker"}
    label_keys "container_name,source"
    remove_keys "container,source"

    line_format key_value

    <buffer>
      flush_interval 5s
      chunk_limit_size 1m
      flush_at_shutdown true
    </buffer>
  </store>

</match>
