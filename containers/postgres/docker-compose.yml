services:
  cdc-postgres:
    image: postgres:16
    container_name: cdc_postgres

    environment:
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cdc_db
    volumes:
      - cdc_data:/var/lib/postgresql/data
    networks:
      - platform-network

    restart: unless-stopped

    ports:
      - "5434:5432"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cdc", "-d", "cdc_db"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s


networks:
  platform-network:
    driver: bridge
    external: true

volumes:
  cdc_data:
    external: true